<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0.8" />
    </linearGradient>

    <!-- Tech Grid Overlay -->
    <pattern id="hudGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="316" rx="12" fill="url(#hudBg)" stroke="url(#hudBorder)" stroke-width="1.5" />
  <rect x="2" y="2" width="896" height="316" rx="12" fill="url(#hudGrid)" />

  <!-- Terminal Header Bar -->
  <rect x="2" y="2" width="896" height="34" rx="12" fill="#161b22" fill-opacity="0.9" />
  <line x1="2" y1="36" x2="898" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="20" cy="19" r="5" fill="#f85149" />
  <circle cx="36" cy="19" r="5" fill="#d29922" />
  <circle cx="52" cy="19" r="5" fill="#2ea043" />

  <!-- Header Title -->
  <text x="74" y="23" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="11.5" font-weight="600" fill="#8b949e" letter-spacing="1.5">
    TERMINAL // LOADOUT &amp; ACTIVE TELEMETRY
  </text>
  <text x="880" y="23" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#38bdf8" letter-spacing="1">
    ● PROTOCOL: NOMINAL
  </text>

  <!-- Left Column: Character Sheet / Core Identity -->
  <g transform="translate(24, 52)">
    <!-- Sub-card background -->
    <rect x="0" y="0" width="396" height="210" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="396" height="26" rx="8" fill="#161b22" />
    <line x1="0" y1="26" x2="396" y2="26" stroke="#30363d" stroke-width="1" />
    <text x="12" y="18" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#38bdf8" letter-spacing="1">
      ► OPERATOR LOADOUT
    </text>

    <!-- Operator Data Fields -->
    <g transform="translate(14, 48)">
      <text x="0" y="0" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#8b949e">CALLSIGN:</text>
      <text x="110" y="0" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#58a6ff">walapalam 🍌</text>

      <text x="0" y="26" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#8b949e">CLASS:</text>
      <text x="110" y="26" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#c9d1d9">Systems &amp; Full-Stack Eng</text>

      <text x="0" y="52" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#8b949e">AFFILIATION:</text>
      <text x="110" y="52" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#7ee787">Kawn Labs</text>

      <text x="0" y="78" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#8b949e">AGENT FLEET:</text>
      <text x="110" y="78" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#c9d1d9">Hermes Orchestration</text>

      <text x="0" y="104" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#8b949e">LOCAL MESH:</text>
      <text x="110" y="104" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#c9d1d9">WireGuard · Omada Gateway</text>

      <text x="0" y="130" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#8b949e">LOCATION:</text>
      <text x="110" y="130" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#c9d1d9">Colombo, LK (6.9271° N)</text>
    </g>
  </g>

  <!-- Right Column: Engineering Disciplines -->
  <g transform="translate(436, 52)">
    <!-- Sub-card background -->
    <rect x="0" y="0" width="440" height="210" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect x="0" y="0" width="440" height="26" rx="8" fill="#161b22" />
    <line x1="0" y1="26" x2="440" y2="26" stroke="#30363d" stroke-width="1" />
    <text x="12" y="18" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="600" fill="#a855f7" letter-spacing="1">
      ► ACTIVE SYSTEMS &amp; CORE DOMAINS
    </text>

    <!-- Domain 1: Odoo ERP & POS Core -->
    <g transform="translate(14, 44)">
      <circle cx="4" cy="4" r="3" fill="#a855f7" />
      <text x="16" y="7" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#f0f6fc">
        ODOO ERP &amp; POS INFRASTRUCTURE
      </text>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#8b949e">
        Custom OWL UI · IoT Box &amp; ESC/POS hardware · Concurrency &amp; ledgers
      </text>
    </g>

    <!-- Domain 2: Hermes Agent Orchestrations -->
    <g transform="translate(14, 94)">
      <circle cx="4" cy="4" r="3" fill="#38bdf8" />
      <text x="16" y="7" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#f0f6fc">
        HERMES AGENT ORCHESTRATION (MCP)
      </text>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#8b949e">
        Multi-agent pipelines · Headless worker swarms · High-context IPC
      </text>
    </g>

    <!-- Domain 3: Edge & Zero-Trust Mesh -->
    <g transform="translate(14, 144)">
      <circle cx="4" cy="4" r="3" fill="#34d399" />
      <text x="16" y="7" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#f0f6fc">
        DISTRIBUTED CLOUD &amp; DATA SYSTEMS
      </text>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="11" fill="#8b949e">
        PostgreSQL 17 tuning · Docker / Coolify · Cloudflare Zero-Trust edge
      </text>
    </g>
  </g>

  <!-- Bottom Telemetry Status Bar -->
  <g transform="translate(24, 276)">
    <rect x="0" y="0" width="852" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <!-- Status Dot -->
    <circle cx="16" cy="15" r="4" fill="#2ea043" />
    
    <!-- Quest Line -->
    <text x="28" y="18.5" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="9.5" fill="#8b949e">
      MISSION: <tspan fill="#c9d1d9">Architecting deterministic POS, Hermes agent swarms, and resilient networks.</tspan>
    </text>

    <!-- Right-aligned Gamer Vitals -->
    <text x="838" y="18.5" text-anchor="end" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="9.5" fill="#e3b341">
      ⚡ MANA: 100% COFFEE · STATUS: ACTIVE
    </text>
  </g>
</svg>
