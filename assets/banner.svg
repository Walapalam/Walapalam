<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Subtle Accent Glow -->
    <radialGradient id="cyanGlow" cx="15%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.0" />
    </radialGradient>

    <!-- Linear Accent Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Container Box with Rounded Edges -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Dot Grid Overlay -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#dotGrid)" />
  
  <!-- Subtle Cyan Radial Highlight -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#cyanGlow)" />

  <!-- Top Metadata Bar -->
  <g transform="translate(32, 34)">
    <!-- Terminal Status Indicator -->
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8" />
    <circle cx="0" cy="0" r="8" fill="#38bdf8" fill-opacity="0.25">
      <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.3;0.05;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    
    <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#7dd3fc" letter-spacing="1.5">
      KAWN LABS // SYSTEMS ARCHITECTURE &amp; RESEARCH
    </text>

    <!-- Right-aligned System Tags -->
    <text x="836" y="4" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="11" fill="#8b949e" letter-spacing="1">
      LOC: 6.9271° N, 79.8612° E · STATUS: ONLINE
    </text>
  </g>

  <!-- Main Identity Block -->
  <g transform="translate(32, 98)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Helvetica, sans-serif" font-size="34" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">
      Raqeeb Rameez
    </text>
    <text x="270" y="-3" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="16" font-weight="500" fill="#8b949e">
      (@walapalam)
    </text>
  </g>

  <!-- Positioning Subtitle -->
  <g transform="translate(32, 134)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#c9d1d9">
      Systems &amp; Full-Stack Engineer specializing in <tspan fill="#38bdf8" font-weight="500">Hermes Agent Orchestration</tspan>, <tspan fill="#38bdf8" font-weight="500">Distributed Platforms</tspan>, and <tspan fill="#38bdf8" font-weight="500">Odoo ERP / POS Core</tspan>.
    </text>
  </g>

  <!-- Bottom Badges / Metrics Pill Row -->
  <g transform="translate(32, 182)">
    <!-- Pill 1: Architecture -->
    <rect x="0" y="-16" width="195" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="97" y="0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e">
      ⚡ HERMES ORCHESTRATION
    </text>

    <!-- Pill 2: Infrastructure -->
    <rect x="205" y="-16" width="175" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="292" y="0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e">
      🛡️ ZERO-TRUST MESH
    </text>

    <!-- Pill 3: POS / ERP -->
    <rect x="390" y="-16" width="175" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="477" y="0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8b949e">
      📦 ODOO ERP &amp; POS
    </text>

    <!-- Pill 4: Advisory / Freelance -->
    <rect x="575" y="-16" width="190" height="24" rx="6" fill="#161b22" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="670" y="0" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#38bdf8">
      AVAILABLE FOR ADVISORY
    </text>
  </g>
</svg>
